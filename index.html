<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainy Night — Three.js</title>

  <!-- ─── Three.js r165 importmap ─────────────────────────────────────── -->
  <script type="importmap">
  {
    "imports": {
      "three":                  "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/":          "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050a;
      font-family: 'Courier New', monospace;
    }

    /* ── Canvas ─────────────────────────────────────────────────────────── */
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* ── Minimal overlay ────────────────────────────────────────────────── */
    #overlay {
      position: fixed;
      bottom: 14px;
      right: 18px;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(120, 140, 210, 0.30);
      pointer-events: none;
      user-select: none;
      text-transform: uppercase;
    }

    /* ── Loading screen (Phase 1 sadece bir frame görünür) ─────────────── */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05050a;
      color: rgba(120, 140, 210, 0.5);
      font-size: 11px;
      letter-spacing: 3px;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 10;
    }

    #loading.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="loading">INITIALIZING</div>
  <div id="overlay">TIKLA / BOŞLUK → SESİ AÇ & ŞİMŞEK ÇAKTIR</div>

  <!-- ─── Entry point (ES module) ────────────────────────────────────── -->
  <script type="module" src="./main.js"></script>

</body>
</html>
