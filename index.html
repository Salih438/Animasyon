<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainy Night — Three.js</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌧️</text></svg>" />

  <!-- ─── Three.js r165 importmap ─────────────────────────────────────── -->
  <script type="importmap">
  {
    "imports": {
      "three":                  "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/":          "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050a;
      font-family: 'Courier New', monospace;
    }

    /* ── Canvas ─────────────────────────────────────────────────────────── */
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* ── Minimal overlay ────────────────────────────────────────────────── */
    #overlay {
      position: fixed;
      bottom: 14px;
      right: 18px;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(180, 205, 255, 0.70);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      user-select: none;
      text-transform: uppercase;
      z-index: 50;
      transition: color 0.3s ease;
    }

    @media (max-width: 900px) {
      #overlay {
        font-size: 9px;
        letter-spacing: 1px;
        right: 10px;
        bottom: 10px;
        max-width: calc(100vw - 20px);
        text-align: right;
      }
    }

    /* ── Loading screen (Phase 1 sadece bir frame görünür) ─────────────── */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05050a;
      color: rgba(120, 140, 210, 0.5);
      font-size: 11px;
      letter-spacing: 3px;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 10;
    }

    #loading.hidden {
      opacity: 0;
    }

    /* ── Error overlay ──────────────────────────────────────────────────── */
    #error-overlay {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080910;
      color: #ff5566;
      font-size: 12px;
      letter-spacing: 1.5px;
      padding: 24px;
      text-align: center;
      z-index: 100;
    }

    #error-overlay.visible {
      display: flex;
    }

    #error-overlay h2 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #ff3344;
      letter-spacing: 3px;
    }

    #error-overlay p {
      color: rgba(220, 230, 255, 0.75);
      margin-bottom: 8px;
    }

    #error-overlay pre {
      margin-top: 14px;
      padding: 12px 18px;
      background: rgba(255, 50, 50, 0.08);
      border: 1px solid rgba(255, 50, 50, 0.25);
      border-radius: 4px;
      font-size: 11px;
      max-width: 90vw;
      overflow-x: auto;
      color: #ffd0d5;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div id="loading">INITIALIZING</div>
  <div id="overlay">← / A: CADDEYE BAK | → / D: BİNALARA BAK | BOŞLUK: ŞİMŞEK | R: ŞEMSİYE AÇ/KAPAT | TIKLA: SES</div>

  <div id="error-overlay">
    <h2>BAŞLATMA HATASI / INITIALIZATION ERROR</h2>
    <p id="error-message">WebGL 2.0 veya 3D sahne modülleri yüklenirken bir sorun oluştu.</p>
    <pre id="error-details"></pre>
  </div>

  <!-- ─── Entry point (ES module) ────────────────────────────────────── -->
  <script type="module" src="./main.js"></script>

</body>
</html>
